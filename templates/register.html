{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:24px auto 0">
  <p class="muted" style="font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px">СТАРТ ОБУЧЕНИЯ</p>
  <h1>Регистрация</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="username">Имя</label>
    <input id="username" type="text" name="username" value="{{ username or '' }}" required minlength="3" maxlength="24" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="password">Пароль</label>
    <input id="password" type="password" name="password" required minlength="6" autocomplete="new-password">
    <label for="password2">Пароль ещё раз</label>
    <input id="password2" type="password" name="password2" required minlength="6" autocomplete="new-password">
    <div class="row" style="margin-top:16px">
      <button type="submit">Создать</button>
      <a class="btn ghost" href="{{ url_for('login') }}">У меня есть аккаунт</a>
    </div>
  </form>
</div>
{% endblock %}
