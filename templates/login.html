{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:24px auto 0">
  <h1>Вход</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="username">Имя</label>
    <input id="username" type="text" name="username" value="{{ username or '' }}" required maxlength="128" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="password">Пароль</label>
    <input id="password" type="password" name="password" required maxlength="1024" autocomplete="current-password">
    <div class="row" style="margin-top:16px">
      <button type="submit">Войти</button>
      <a class="btn ghost" href="{{ url_for('register') }}">Регистрация</a>
    </div>
  </form>
</div>
{% endblock %}
